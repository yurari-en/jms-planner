<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JMS 装備強化順序プランナー</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238b7cf6'/%3E%3Cpath d='M16 5l3.2 7.1 7.8.8-5.8 5.3 1.7 7.7L16 22l-6.9 3.9 1.7-7.7L5 12.9l7.8-.8z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var dark = false;
        try {
          var raw = localStorage.getItem('jmsplanner:v1:ui');
          if (raw) {
            dark = JSON.parse(raw).theme === 'dark';
          } else {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch (e) {
          dark = false;
        }
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
